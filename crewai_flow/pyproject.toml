[project]
name = "crewai_flow"
version = "0.1.0"
description = "CrewAI Flow that generates contacts, waits for a human to approve or reject the batch, and returns the list"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0",
    "faker>=40.41.0",
    "httpx>=0.27",
    "pydantic-settings>=2.7,<3.0",
]

[project.scripts]
kickoff = "crewai_flow.main:kickoff"
plot = "crewai_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
project_id = "588ed1b1-924a-4758-a419-a9400213e6a7"
